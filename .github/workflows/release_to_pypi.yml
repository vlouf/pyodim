name: Publish PYODIM to PyPI

on:
  release:
    types:
      - published

jobs:
  build-n-publish:
    name: Build and publish to PyPI
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Build source and wheel distributions
        run: |
          python -m pip install --upgrade build twine
          python -m build
          twine check --strict dist/*

      - name: Publish distribution to PyPI
        # Authenticates via the Trusted Publisher configured on PyPI: the action
        # performs the OIDC exchange itself, which also enables PEP 740 attestations.
        uses: pypa/gh-action-pypi-publish@release/v1
